services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 200
    mem_limit: 256m
    cpus: 0.75
    stop_grace_period: 20s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ${EDGE_ENV_FILE:?Set EDGE_ENV_FILE}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - production_edge
      - staging_edge

volumes:
  caddy_data:
  caddy_config:

networks:
  production_edge:
    external: true
    name: luenio-production-edge
  staging_edge:
    external: true
    name: luenio-staging-edge
