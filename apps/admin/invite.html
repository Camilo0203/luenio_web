<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#071a33" />
    <title>Aceptar invitación | Luenio</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/apps/web/src/style.css" />
    <link rel="stylesheet" href="/apps/admin/src/admin.css" />
  </head>
  <body class="auth-body auth-body--compact">
    <main class="auth-shell">
      <section class="auth-panel">
        <a class="auth-wordmark auth-wordmark--compact" href="/" aria-label="Luenio, inicio">
          <img
            class="auth-wordmark__logo"
            src="/brand/isotipo.svg"
            width="454"
            height="478"
            alt=""
          />
          <span>Luenio</span>
        </a>
        <p class="eyebrow">Invitación privada</p>
        <h1>Activa tu espacio de trabajo.</h1>
        <p>Crea una contraseña para acceder al dashboard que Luenio preparó para tu empresa.</p>
        <form class="contact-form auth-form" id="inviteForm" novalidate>
          <label class="wide"
            >Contraseña<input
              name="password"
              type="password"
              minlength="12"
              maxlength="256"
              autocomplete="new-password"
              required
          /></label>
          <div class="wide" data-password-strength></div>
          <label class="wide"
            >Confirmar contraseña<input
              name="confirmation"
              type="password"
              minlength="12"
              maxlength="256"
              autocomplete="new-password"
              required
          /></label>
          <button class="button button-primary wide" type="submit">Activar mi acceso</button>
          <p class="form-status wide" role="status" aria-live="polite" hidden></p>
        </form>
      </section>
    </main>
    <script type="module" src="/apps/admin/src/invite.js"></script>
    <!-- impeccable-live-start -->
    <!-- impeccable-live-end -->
  </body>
</html>
