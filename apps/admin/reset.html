<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#071a33" />
    <title>Restablecer acceso | Luenio</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/apps/web/src/style.css" />
    <link rel="stylesheet" href="/apps/admin/src/admin.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-panel">
        <a class="brand" href="/" aria-label="Luenio"
          ><img class="brand-logo" src="/brand/isotipo.svg" width="208" height="256" alt=""
        /></a>
        <p class="eyebrow">Acceso privado</p>
        <h1 data-reset-title>Recupera tu acceso.</h1>
        <p data-reset-copy>Recibirás un enlace si el correo pertenece a una cuenta activa.</p>
        <form class="contact-form auth-form" id="resetForm" novalidate>
          <label class="wide" data-email-field
            >Email<input name="email" type="email" autocomplete="email"
          /></label>
          <label class="wide" data-password-field hidden
            >Nueva contraseña<input
              name="password"
              type="password"
              minlength="12"
              maxlength="256"
              autocomplete="new-password"
          /></label>
          <div class="wide" data-password-strength hidden></div>
          <label class="wide" data-confirmation-field hidden
            >Confirmar contraseña<input
              name="confirmation"
              type="password"
              minlength="12"
              maxlength="256"
              autocomplete="new-password"
          /></label>
          <button class="button button-primary wide" type="submit">Enviar enlace seguro</button>
          <p class="form-status wide" role="status" aria-live="polite" hidden></p>
        </form>
        <a class="auth-recovery-link" href="/login">Volver al inicio de sesión</a>
      </section>
    </main>
    <script type="module" src="/apps/admin/src/reset.js"></script>
    <!-- impeccable-live-start -->
    <!-- impeccable-live-end -->
  </body>
</html>
